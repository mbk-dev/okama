language: python

dist: noble

python:
  - "3.11"
  - "3.14"

before_install:
  - python -m pip install uv==0.12.23
install:
  - uv sync --python "$(command -v python)" --no-default-groups --group test
script:
  - uv run --python "$(command -v python)" --no-sync python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '$TRAVIS_PYTHON_VERSION'"
  - uv run --python "$(command -v python)" --no-sync --with pytest-cov --with coveralls pytest tests --cov=okama/
after_success:
  - uv run --python "$(command -v python)" --no-sync --with coveralls coveralls
