[project]
name = "okama"
version = "4.0.0"
description = "Investment portfolio analyzing & optimization tools"
authors = [{name = "Sergey Kikevich", email = "chilango74@gmail.com"}]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
keywords = ["finance", "investments", "efficient frontier", "python", "optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=13.0.0",
    "scipy",
    "matplotlib>=3.5.1",
    "requests",
    "joblib",
    "pandas-stubs",
    "arch>=7.2.0",
    "statsmodels>=0.14.5",
    "idna>=3.15",
    "pillow>=13.0.0",
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://okama.io"
Repository = "https://github.com/mbk-dev/okama"
Documentation = "https://okama.readthedocs.io/en/master"

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "black[jupyter]>=26.10.1",
    "pytest-xdist",
    "scipy-stubs",
]
docs = [
    "sphinx<9",
    "sphinx-rtd-theme",
    "numpydoc",
    "nbsphinx",
    "nbsphinx-link>=1.3.0",
    "pandoc>=1.1.0",
    "recommonmark",
    "Jinja2",
    "docutils<0.22",
    "ipython>=7.20.0",
    "nbconvert>=7.17.2",
    "tornado>=6.5.9",
]
jupyter = [
    "jupyter",
    "notebook>=7.6.3",
    "ipykernel",
    "ipython",
    "nbmake",
    "zmq",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "tornado>=6.5.9",
]
dev = [
    "ruff",
    "pre-commit",
    "filelock>=4.2.1",
    "virtualenv>=21.14.9",
]

[tool.uv]
default-groups = ["test", "docs", "jupyter", "dev"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "okama"
module-root = ""

[tool.ruff]
line-length = 120
extend-exclude = ["docs", ".ipynb_checkpoints", "env", ".env"]
target-version = "py311"

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
