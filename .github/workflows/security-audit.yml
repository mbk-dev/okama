name: Security source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: security-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks on automatic events
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: mbk-dev/cbrapi/.github/actions/security-audit@2b32319a99d4da63644995eed3faf18faec28cea
        with:
          base-sha: ${{ github.event.pull_request.base.sha || '' }}
          stage: secrets
      - name: Run pinned source audit
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: mbk-dev/cbrapi/.github/actions/security-audit@08be62bd91bcc85c04605889701a4bcd34e25a07
        with:
          base-sha: ${{ github.event.pull_request.base.sha || '' }}
