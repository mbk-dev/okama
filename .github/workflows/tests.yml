name: Tests

on: [push, pull_request]

# The suite is fully offline: tests/conftest.py replaces socket.socket with a
# deny stub for the whole session, so no secrets or network access are needed.
jobs:
  tests:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # Must cover the whole range declared in pyproject.toml
        # (requires-python = ">=3.11,<4.0.0") and in the trove classifiers.
        # The minimum version is not optional: annotations are evaluated
        # eagerly before Python 3.14 (PEP 649), so an invalid type hint breaks
        # `import okama` on 3.11-3.13 while passing silently on 3.14.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --no-default-groups --group test

      - name: Import check
        run: |
          uv run --no-sync python -c "import os, sys, okama; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON']; print(sys.version); print(okama.__version__, okama.__file__)"

      - name: Run tests
        # Pass the tests directory explicitly so pytest picks up tests/pytest.ini,
        # which caps xdist at a fixed worker count.
        run: uv run --no-sync pytest tests -q

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: false

      - name: Build and validate distributions
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          package_dir="$RUNNER_TEMP/okama-package"
          uv build --no-sources --python 3.11 --out-dir "$package_dir"
          cd "$package_dir"
          shopt -s nullglob
          wheels=(*.whl)
          sdists=(*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          uvx --from twine==6.2.0 twine check --strict "${wheels[@]}" "${sdists[@]}"
          printf '%s\n' "$SOURCE_SHA" > source-sha.txt
          sha256sum -- "${wheels[@]}" "${sdists[@]}" > SHA256SUMS

      - name: Upload the validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: okama-distributions-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/okama-package/
          if-no-files-found: error
          retention-days: 14
