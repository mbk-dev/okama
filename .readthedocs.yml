# Keep installation aligned in both supported Read the Docs config paths.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - '"$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install uv==0.12.23'
    install:
      - '"$READTHEDOCS_VIRTUALENV_PATH/bin/uv" pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" . --group docs'
sphinx:
  configuration: docs/conf.py
